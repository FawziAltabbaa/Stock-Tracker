<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #0f172a;
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .timestamp {
            color: #94a3b8;
            font-size: 0.85em;
            margin-top: 16px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .stat-label {
            color: #64748b;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .stat-value {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2em;
            font-weight: 800;
        }

        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stock-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
            border-radius: 12px;
            padding: 24px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .stock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
        }

        .stock-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
            border-color: #3b82f6;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .stock-ticker {
            font-size: 1.6em;
            font-weight: 800;
            color: #3b82f6;
        }

        .stock-name {
            color: #64748b;
            font-size: 0.9em;
            margin-top: 4px;
        }

        .stock-score {
            font-size: 2.2em;
            font-weight: 800;
            text-align: right;
        }

        .score-excellent { color: #059669; }
        .score-good { color: #2563eb; }
        .score-moderate { color: #d97706; }
        .score-poor { color: #dc2626; }

        .stock-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .metric-box {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bae6fd;
        }

        .metric-label {
            font-size: 0.75em;
            color: #0c4a6e;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #0369a1;
            margin-top: 4px;
        }

        .pe-ratio {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border-color: #fecaca;
        }

        .pe-ratio .metric-label {
            color: #7f1d1d;
        }

        .pe-ratio .metric-value {
            color: #991b1b;
        }

        .view-details {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .view-details:hover {
            background: #2563eb;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 32px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            color: #94a3b8;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close:hover {
            color: #0f172a;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .modal-title {
            font-size: 1.8em;
            font-weight: 800;
            color: #0f172a;
        }

        .modal-subtitle {
            color: #64748b;
            margin-top: 4px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .detail-box {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .detail-label {
            color: #64748b;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: 800;
            color: #3b82f6;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #fecaca;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 32px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sort-controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .sort-controls label {
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }

        .sort-controls select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .sort-controls select option {
            background: #0f172a;
            color: white;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .stocks-grid {
                grid-template-columns: 1fr;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .stock-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Stock Tracker</h1>
            <p class="subtitle">Deep dive into 50 stocks with real-time scoring</p>
            <div class="controls">
                <button onclick="refreshData()">🔄 Refresh Data</button>
                <button onclick="downloadCSV()">📥 Download CSV</button>
                <button onclick="toggleHelp()">❓ How to Read</button>
            </div>
            <div class="timestamp" id="timestamp"></div>
        </header>

        <div class="sort-controls">
            <label>Sort by:</label>
            <select onchange="sortStocks(this.value)">
                <option value="score-desc">Score (High → Low)</option>
                <option value="score-asc">Score (Low → High)</option>
                <option value="momentum-desc">Momentum (High → Low)</option>
                <option value="momentum-asc">Momentum (Low → High)</option>
                <option value="valuation-desc">Valuation (High → Low)</option>
                <option value="valuation-asc">Valuation (Low → High)</option>
                <option value="sentiment-desc">Sentiment (High → Low)</option>
                <option value="sentiment-asc">Sentiment (Low → High)</option>
                <option value="ticker">Ticker (A → Z)</option>
            </select>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading stocks...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="dashboard">
                <div class="stat-card">
                    <div class="stat-label">Top Stock</div>
                    <div class="stat-value" id="topStock">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Score</div>
                    <div class="stat-value" id="avgScore">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Stocks</div>
                    <div class="stat-value" id="totalStocks">-</div>
                </div>
            </div>

            <div class="stocks-grid" id="stocksGrid"></div>
        </div>
    </div>

    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalTicker">-</div>
                    <div class="modal-subtitle" id="modalName">-</div>
                </div>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>

            <div class="modal-grid">
                <div class="detail-box">
                    <div class="detail-label">Overall Score</div>
                    <div class="detail-value" id="modalScore">-</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Momentum</div>
                    <div class="detail-value" id="modalMomentum">-</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Valuation</div>
                    <div class="detail-value" id="modalValuation">-</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Sentiment</div>
                    <div class="detail-value" id="modalSentiment">-</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">P/E Ratio</div>
                    <div class="detail-value" id="modalPE">-</div>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <div class="detail-label" style="margin-bottom: 12px;">📰 Latest Headlines</div>
                <div id="modalHeadlines" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>⚠️ Informational scores only, not financial advice</p>
    </div>

    <script>
        let allStocks = [];

        function getScoreClass(score) {
            if (score >= 70) return 'score-excellent';
            if (score >= 55) return 'score-good';
            if (score >= 40) return 'score-moderate';
            return 'score-poor';
        }

        function formatScore(score) {
            return score ? score.toFixed(1) : 'N/A';
        }

        function renderStocks(stocks) {
            const grid = document.getElementById('stocksGrid');
            grid.innerHTML = '';

            stocks.forEach(stock => {
                const scoreClass = getScoreClass(stock.score);
                const card = document.createElement('div');
                card.className = 'stock-card';
                card.innerHTML = `
                    <div class="stock-header">
                        <div>
                            <div class="stock-ticker">${stock.ticker}</div>
                            <div class="stock-name">${stock.name}</div>
                        </div>
                        <div class="stock-score ${scoreClass}">${formatScore(stock.score)}</div>
                    </div>
                    <div class="stock-metrics">
                        <div class="metric-box">
                            <div class="metric-label">Momentum</div>
                            <div class="metric-value">${formatScore(stock.momentum)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Valuation</div>
                            <div class="metric-value">${formatScore(stock.valuation)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Sentiment</div>
                            <div class="metric-value">${formatScore(stock.sentiment)}</div>
                        </div>
                        <div class="metric-box pe-ratio">
                            <div class="metric-label">P/E</div>
                            <div class="metric-value">${stock.pe_ratio ? stock.pe_ratio.toFixed(2) : 'N/A'}</div>
                        </div>
                    </div>
                    <button class="view-details" onclick="openModal('${stock.ticker}')">Deep Dive →</button>
                `;
                grid.appendChild(card);
            });

            if (stocks.length > 0) {
                document.getElementById('topStock').textContent = stocks[0].ticker;
                const avgScore = (stocks.reduce((sum, s) => sum + s.score, 0) / stocks.length).toFixed(1);
                document.getElementById('avgScore').textContent = avgScore;
                document.getElementById('totalStocks').textContent = stocks.length;
            }

            updateTimestamp();
        }

        function openModal(ticker) {
            const stock = allStocks.find(s => s.ticker === ticker);
            document.getElementById('modalTicker').textContent = stock.ticker;
            document.getElementById('modalName').textContent = stock.name;
            document.getElementById('modalScore').textContent = formatScore(stock.score);
            document.getElementById('modalMomentum').textContent = formatScore(stock.momentum);
            document.getElementById('modalValuation').textContent = formatScore(stock.valuation);
            document.getElementById('modalSentiment').textContent = formatScore(stock.sentiment);
            document.getElementById('modalPE').textContent = stock.pe_ratio ? stock.pe_ratio.toFixed(2) : 'N/A';

            const headlinesDiv = document.getElementById('modalHeadlines');
            const yahooFinanceLink = `https://finance.yahoo.com/quote/${stock.ticker}/news`;
            headlinesDiv.innerHTML = `
                <a href="${yahooFinanceLink}" target="_blank" style="color: #3b82f6; text-decoration: none; padding: 12px; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px; display: block; text-align: center; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#e0f2fe'; this.style.color='#1d4ed8';" onmouseout="this.style.backgroundColor='#f0f9ff'; this.style.color='#3b82f6';">
                    📰 View ${stock.ticker} News on Yahoo Finance
                </a>
            `;

            document.getElementById('stockModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('stockModal').style.display = 'none';
        }

        function sortStocks(sortBy) {
            let sorted = [...allStocks];

            switch(sortBy) {
                case 'score-desc':
                    sorted.sort((a, b) => b.score - a.score);
                    break;
                case 'score-asc':
                    sorted.sort((a, b) => a.score - b.score);
                    break;
                case 'momentum-desc':
                    sorted.sort((a, b) => b.momentum - a.momentum);
                    break;
                case 'momentum-asc':
                    sorted.sort((a, b) => a.momentum - b.momentum);
                    break;
                case 'valuation-desc':
                    sorted.sort((a, b) => b.valuation - a.valuation);
                    break;
                case 'valuation-asc':
                    sorted.sort((a, b) => a.valuation - b.valuation);
                    break;
                case 'sentiment-desc':
                    sorted.sort((a, b) => b.sentiment - a.sentiment);
                    break;
                case 'sentiment-asc':
                    sorted.sort((a, b) => a.sentiment - b.sentiment);
                    break;
                case 'ticker':
                    sorted.sort((a, b) => a.ticker.localeCompare(b.ticker));
                    break;
            }
            renderStocks(sorted);
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = `Last updated: ${now.toLocaleString()}`;
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = `❌ ${message}`;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'none';
        }

        function showContent() {
            document.getElementById('content').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        async function loadData() {
            showLoading();
            try {
                const response = await fetch('/api/stocks');
                if (!response.ok) throw new Error('Failed to load data');
                allStocks = await response.json();
                renderStocks(allStocks);
                showContent();
            } catch (error) {
                showError(error.message);
            }
        }

        async function refreshData() {
            showLoading();
            try {
                const response = await fetch('/api/refresh');
                if (!response.ok) throw new Error('Failed to refresh data');
                const data = await response.json();
                allStocks = data.stocks;
                renderStocks(allStocks);
                showContent();
            } catch (error) {
                showError(error.message);
            }
        }

        function downloadCSV() {
            const link = document.createElement('a');
            link.href = `/daily_scores_${new Date().toISOString().split('T')[0]}.csv`;
            link.download = `stock-scores-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function toggleHelp() {
            alert('SCORE: Overall ranking (60+ = Excellent, 50-59 = Good, 40-49 = Moderate, <40 = Poor)\nMOMENTUM: Price trend (higher = uptrend)\nVALUATION: Is it cheap? (higher = better value)\nSENTIMENT: News headlines (higher = positive)\nP/E RATIO: Price per earnings (lower = better)');
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('stockModal');
            if (event.target == modal) {
                closeModal();
            }
        });

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
