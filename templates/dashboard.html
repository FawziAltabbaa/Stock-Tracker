<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #667eea;
            font-size: 2.5em;
            font-weight: bold;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #333;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .ticker {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .score {
            font-weight: bold;
            font-size: 1.2em;
        }

        .score-excellent {
            color: #10b981;
        }

        .score-good {
            color: #3b82f6;
        }

        .score-moderate {
            color: #f59e0b;
        }

        .score-poor {
            color: #ef4444;
        }

        .bar {
            display: inline-block;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 100px;
        }

        .score-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            display: inline-block;
            background: #f0f4ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .timestamp {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            th, td {
                padding: 10px;
                font-size: 0.9em;
            }

            .stat-value {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Stock Tracker</h1>
            <p class="subtitle">Daily stock screener with momentum, valuation & sentiment scoring</p>
            <div class="controls">
                <button onclick="refreshData()">🔄 Refresh Data</button>
                <button onclick="downloadCSV()">📥 Download CSV</button>
            </div>
            <div class="timestamp" id="timestamp"></div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading stock data...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="dashboard">
                <div class="stat-card">
                    <div class="stat-label">Top Stock</div>
                    <div class="stat-value" id="topStock">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Score</div>
                    <div class="stat-value" id="avgScore">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Stocks</div>
                    <div class="stat-value" id="totalStocks">-</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Company</th>
                            <th>Score</th>
                            <th>Momentum</th>
                            <th>Valuation</th>
                            <th>Sentiment</th>
                            <th>P/E Ratio</th>
                        </tr>
                    </thead>
                    <tbody id="stocksTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>⚠️ Informational scores only, not financial advice</p>
    </div>

    <script>
        function getScoreClass(score) {
            if (score >= 70) return 'score-excellent';
            if (score >= 55) return 'score-good';
            if (score >= 40) return 'score-moderate';
            return 'score-poor';
        }

        function formatScore(score) {
            return score ? score.toFixed(1) : 'N/A';
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stocksTable');
            tbody.innerHTML = '';

            stocks.forEach(stock => {
                const row = document.createElement('tr');
                const scoreClass = getScoreClass(stock.score);

                row.innerHTML = `
                    <td class="ticker">${stock.ticker}</td>
                    <td>${stock.name}</td>
                    <td class="score ${scoreClass}">
                        <div class="score-bar">
                            <span>${formatScore(stock.score)}</span>
                            <div class="bar" style="width: ${stock.score}px;"></div>
                        </div>
                    </td>
                    <td><span class="metric">${formatScore(stock.momentum)}</span></td>
                    <td><span class="metric">${formatScore(stock.valuation)}</span></td>
                    <td><span class="metric">${formatScore(stock.sentiment)}</span></td>
                    <td>${stock.pe_ratio ? stock.pe_ratio.toFixed(2) : 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });

            // Update stats
            if (stocks.length > 0) {
                document.getElementById('topStock').textContent = stocks[0].ticker;
                const avgScore = (stocks.reduce((sum, s) => sum + s.score, 0) / stocks.length).toFixed(1);
                document.getElementById('avgScore').textContent = avgScore;
                document.getElementById('totalStocks').textContent = stocks.length;
            }

            updateTimestamp();
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = `Last updated: ${now.toLocaleString()}`;
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = `❌ ${message}`;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'none';
        }

        function showContent() {
            document.getElementById('content').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        async function loadData() {
            showLoading();
            try {
                const response = await fetch('/api/stocks');
                if (!response.ok) throw new Error('Failed to load data');
                const stocks = await response.json();
                renderStocks(stocks);
                showContent();
            } catch (error) {
                showError(error.message);
            }
        }

        async function refreshData() {
            showLoading();
            try {
                const response = await fetch('/api/refresh');
                if (!response.ok) throw new Error('Failed to refresh data');
                const data = await response.json();
                renderStocks(data.stocks);
                showContent();
            } catch (error) {
                showError(error.message);
            }
        }

        function downloadCSV() {
            const link = document.createElement('a');
            link.href = `/daily_scores_${new Date().toISOString().split('T')[0]}.csv`;
            link.download = `stock-scores-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Load data on page load
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
